name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Gradle 9.3.1 requer Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # RAIZ DO PROBLEMA:
      # RN gradle-plugin usa Kotlin 2.0.21 que tem bug FIR no GH Actions
      # Gradle 9.3.1 usa Kotlin 2.2.0 internamente
      # FIX: atualizar para 2.2.0 para combinar com Gradle 9.3.1
      - name: Patch Kotlin 2.0.21 → 2.2.0 (compativel com Gradle 9.3.1)
        run: |
          TOML="node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml"
          echo "Antes: $(grep 'kotlin = ' $TOML 2>/dev/null)"
          sed -i 's/kotlin = "2\.0\.[0-9]*"/kotlin = "2.2.0"/' "$TOML" 2>/dev/null || true
          echo "Depois: $(grep 'kotlin = ' $TOML 2>/dev/null)"

          # Patch em todos os build.gradle.kts do plugin RN
          find node_modules/@react-native/gradle-plugin -name "*.kts" 2>/dev/null | while read f; do
            sed -i 's/kotlin("jvm") version "2\.0\.[0-9]*"/kotlin("jvm") version "2.2.0"/g' "$f"
          done

          # Patch gradle.properties do projeto para suprimir warnings
          echo "" >> android/gradle.properties
          echo "kotlin.jvm.target.validation.mode=WARNING" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "Gradle properties:"
          tail -4 android/gradle.properties

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConstrutorRH-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Info APK
        run: find android -name "*.apk" -exec ls -lh {} \;
