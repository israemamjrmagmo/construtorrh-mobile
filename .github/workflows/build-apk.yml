name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # FIX: Kotlin 2.0.21 tem bug no FIR compiler no GitHub Actions
      # Patch: downgrade para 1.9.24 (sem FIR) no plugin do React Native
      - name: Patch Kotlin 2.0.21 → 1.9.24 (fix FIR compiler bug)
        run: |
          TOML="node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml"
          if [ -f "$TOML" ]; then
            echo "Antes: $(grep 'kotlin = ' $TOML)"
            sed -i 's/kotlin = "2\.[0-9.]*"/kotlin = "1.9.24"/' "$TOML"
            echo "Depois: $(grep 'kotlin = ' $TOML)"
          fi
          # Também patch em qualquer build.gradle.kts do plugin
          find node_modules/@react-native/gradle-plugin -name "build.gradle.kts" | while read f; do
            sed -i 's/version("2\.[0-9.]*")/version("1.9.24")/g' "$f"
            sed -i 's/"kotlin-jvm" version "2\.[0-9.]*"/"kotlin-jvm" version "1.9.24"/g' "$f"
          done
          echo "Patch aplicado."

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --warning-mode all
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConstrutorRH-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Info APK
        run: find android -name "*.apk" -exec ls -lh {} \;
