name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Expo SDK 56 / React Native 0.79 requer Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Aceitar todas as licenças do SDK pré-instalado no runner
      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" 2>/dev/null || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (gera projeto Android nativo)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Gradle Build (APK debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConstrutorRH-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Info do APK
        run: |
          echo "✅ APK gerado com sucesso!"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
